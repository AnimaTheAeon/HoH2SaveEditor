[package]
name = "hoh2edit"
version = "0.1.0"
edition = "2024"

[dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
